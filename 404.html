<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <script>
      var route = window.location.pathname + window.location.search
      window.location.replace('/?route=' + encodeURIComponent(route) + window.location.hash)
    </script>
  </head>
  <body></body>
</html>
